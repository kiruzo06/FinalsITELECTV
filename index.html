<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Management Quiz (Parts 1-4)</title>
    <style>
        :root {
            --bg: #f8fafc;
            --header-bg: #1e293b;
            --card-bg: #ffffff;
            --primary: #3b82f6;
            --success: #10b981;
            --error: #f43f5e;
            --text-main: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main);
            line-height: 1.6;
            scroll-behavior: smooth; /* Smooth scrolling for auto-focus */
        }

        header {
            position: sticky;
            top: 0;
            background-color: var(--header-bg);
            color: white;
            padding: 1rem;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-display {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .shuffle-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .quiz-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        /* Highlight the active card */
        .quiz-card:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
        }

        input[type="text"]:focus { border-color: var(--primary); }

        .check-btn {
            background-color: var(--header-bg);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .check-btn:disabled { opacity: 0.5; }

        .feedback {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }

        .correct { background-color: #d1fae5; color: var(--success); display: block; border-left: 5px solid var(--success); }
        .incorrect { background-color: #fee2e2; color: var(--error); display: block; border-left: 5px solid var(--error); }

        @media (max-width: 600px) {
            .input-area { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <h2>Server Quiz (Parts 1-4)</h2>
        <div class="score-display">Score: <span id="score">0</span> / <span id="total">0</span></div>
        <button class="shuffle-btn" onclick="renderQuiz(true)">Shuffle & Reset</button>
    </div>
</header>

<div class="container" id="quiz-container"></div>

<script>
    const questions = [
        // PART 1 & 2
        { q: "A computer or system that provides resources, services, or data to other computers over a network.", a: ["Server"] },
        { q: "The specific type of server that stores and manages files for users.", a: ["File Server"] },
        { q: "The server type that manages printers and print jobs.", a: ["Print Server"] },
        { q: "The server type that hosts websites and web applications.", a: ["Web Server"] },
        { q: "The server type that stores and manages databases.", a: ["Database Server"] },
        { q: "The server type that handles email sending and receiving.", a: ["Mail Server"] },
        { q: "The server type that runs software applications.", a: ["Application Server"] },
        { q: "The server type that converts domain names into IP addresses.", a: ["DNS Server", "DNS"] },
        { q: "The server type that automatically assigns IP addresses.", a: ["DHCP Server", "DHCP"] },

        // PART 3
        { q: "In the client-server model, which component requests services?", a: ["Client"] },
        { q: "In the client-server model, which component provides resources and services?", a: ["Server"] },
        { q: "The key characteristic where resources and data security are controlled through the server.", a: ["Centralized", "Centralized control"] },
        { q: "The key characteristic that ensures high security levels on a network.", a: ["Security"] },
        { q: "The key characteristic that allows any or all elements to be replaced individually as needs increase.", a: ["Scalability"] },
        { q: "The advantage where new technology can be easily integrated.", a: ["Flexibility"] },
        { q: "The advantage where all components (client/network/server) work together.", a: ["Interoperability"] },
        { q: "The advantage where a server can be accessed remotely and across multiple platforms.", a: ["Accessibility"] },
        { q: "A disadvantage involving the initial expense required for equipment.", a: ["Initial investment", "Expense"] },
        { q: "A disadvantage where operations cease across the network if the server goes down.", a: ["Dependence", "Server dependence"] },
        { q: "A network created when two or more PCs are connected and share resources without a separate server.", a: ["Peer-to-Peer", "P2P", "Peer-to-Peer Network"] },
        { q: "A disadvantage of P2P networks because they have no central repository.", a: ["Decentralized"] },

        // PART 4
        { q: "What does NOS stand for?", a: ["Network Operating System"] },
        { q: "The function of NOS that handles user accounts and permissions.", a: ["User management"] },
        { q: "The function of NOS that allows multiple users to access hardware like printers and shared folders.", a: ["File and printer sharing"] },
        { q: "The function of NOS responsible for keeping the network secure.", a: ["Security management"] },
        { q: "The function of NOS that manages services like DNS and DHCP.", a: ["Network services"] },
        { q: "The function of NOS that allows users to access the server from a remote location.", a: ["Remote access"] },
        { q: "Name one of the specific examples of NOS mentioned in the text (e.g., Windows...).", a: ["Windows Server", "Linux", "Ubuntu Server", "CentOS", "UNIX"] }
    ];

    let currentScore = 0;

    function renderQuiz(doShuffle = false) {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        currentScore = 0;
        document.getElementById('score').innerText = '0';
        
        const quizList = doShuffle ? questions.sort(() => Math.random() - 0.5) : questions;
        document.getElementById('total').innerText = quizList.length;

        quizList.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `card-${index}`;
            card.innerHTML = `
                <div class="question-text">${index + 1}. ${item.q}</div>
                <div class="input-area">
                    <input type="text" id="input-${index}" placeholder="Type answer..." autocomplete="off">
                    <button class="check-btn" id="btn-${index}" onclick="checkAnswer(${index}, ${JSON.stringify(item.a).replace(/"/g, '&quot;')})">Check</button>
                </div>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            container.appendChild(card);
            
            // Handle Enter Key
            card.querySelector('input').addEventListener('keypress', (e) => {
                if(e.key === 'Enter') document.getElementById(`btn-${index}`).click();
            });
        });
        
        // Focus the first input on load
        setTimeout(() => document.getElementById('input-0')?.focus(), 100);
    }

    function checkAnswer(id, correctAnswers) {
        const input = document.getElementById(`input-${id}`);
        const btn = document.getElementById(`btn-${id}`);
        const feedback = document.getElementById(`feedback-${id}`);
        const val = input.value.trim().toLowerCase();

        if (!val) return;

        const isCorrect = correctAnswers.some(a => a.toLowerCase() === val);
        input.disabled = true;
        btn.disabled = true;

        if (isCorrect) {
            feedback.innerText = "✓ Correct!";
            feedback.className = "feedback correct";
            currentScore++;
            document.getElementById('score').innerText = currentScore;
        } else {
            feedback.innerText = `✗ Incorrect. Correct: ${correctAnswers[0]}`;
            feedback.className = "feedback incorrect";
        }

        // --- AUTO-ADVANCE LOGIC ---
        const nextId = id + 1;
        const nextInput = document.getElementById(`input-${nextId}`);
        
        if (nextInput) {
            nextInput.focus();
            // Scroll to the next card so it's centered and not hidden by the sticky header
            nextInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    window.onload = () => renderQuiz(false);
</script>

</body>
</html>
